[package]
name = "hensuki"
version = "3.0.2"
edition = "2024"
authors = ["sinkaroid <hey@sinkaroid.org>"]
description = "A fault-tolerant, adaptive imageboards downloader"
readme = "README.md"
repository = "https://github.com/sinkaroid/hensuki"
license = "MIT"
keywords = ["booru", "scraper", "downloader", "anime", "cli"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.13", features = ["stream", "default-tls", "cookies", "http2", "json"] }
scraper = "0.27"
regex = "1.10"
dialoguer = "0.12"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
